# ============ 8) dead-letter — field บังคับหาย ต้องไม่ทิ้ง event เงียบๆ ============
# พิสูจน์ reroute_dropped: event ที่ไม่มี event_type (field บังคับของ lane api)
# ต้อง "ไม่มี" output ปกติจาก parse_api เลย (no_outputs_from) แต่ต้องโผล่ที่
# ทาง .dropped แทน
#
# หมายเหตุจากการรันจริง: ตอน abort() Vector จะ "ยกเลิก" การแก้ไขทั้งหมดที่ remap
# นี้เพิ่งทำไป (รวมถึง .raw = encode_json(.) ที่ตั้งไว้ก่อน abort) แล้วส่ง event
# ต้นฉบับล้วนๆ ไปที่ .dropped แทน ไม่ใช่ event ที่แก้ไปครึ่งทาง — ดีต่อการ debug
# เพราะเห็นข้อมูลดิบเป๊ะๆ แต่แปลว่าเช็คได้แค่ field ที่มาจาก input เดิมเท่านั้น

[[tests]]
name = "api: ขาด event_type -> ไม่ผ่าน parse_api ปกติ ต้องไหลไป dead-letter"
no_outputs_from = ["parse_api"]

[[tests.inputs]]
insert_at = "parse_api"
type      = "log"
log_fields.tenant       = "demoA"
log_fields.source       = "api"
log_fields."@timestamp" = "2025-08-20T07:20:00Z"

[[tests.outputs]]
extract_from = "parse_api.dropped"

[[tests.outputs.conditions]]
type   = "vrl"
source = '''
  assert_eq!(.source, "api")
  assert_eq!(.tenant, "demoA")
  assert!(!exists(.event_type))
  assert!(!exists(.severity))
'''

# ============ 9) parse_error_normalize — event ที่ dropped ต้องยัง insert เข้า logs ได้ ============
# ทดสอบสาย parse_api (abort) -> .dropped -> parse_error_normalize ต่อเนื่องกัน
# ในเทสเดียว — พิสูจน์ว่า event ที่ field ไม่ครบตั้งแต่ต้นจะไม่ทำให้ insert เข้า
# ตาราง logs พัง (NOT NULL ครบทุกคอลัมน์) และยังสืบได้ว่า parser ไหนทำให้ drop

[[tests]]
name = "parse_error_normalize: event ที่ dropped ยัง insert เข้า logs ได้"

[[tests.inputs]]
insert_at = "parse_api"
type      = "log"
log_fields.tenant       = "demoA"
log_fields.source       = "api"
log_fields."@timestamp" = "2025-08-20T07:20:00Z"

[[tests.outputs]]
extract_from = "parse_error_normalize"

[[tests.outputs.conditions]]
type   = "vrl"
source = '''
  # เช็คทุกคอลัมน์ NOT NULL ของตาราง logs ให้ครบ ไม่ใช่แค่บาง field — บั๊กที่เจอ
  # จริงตอน insert (ลืมใส่ .event_id) คือ field ที่เทสเดิมไม่ได้เช็คไว้เลย
  assert!(is_string(.event_id))
  assert!(is_string(.ts))
  assert!(is_string(.ingested_at))
  assert_eq!(.tenant, "demoA")
  assert_eq!(.source, "parse_error")
  assert_eq!(.event_type, "parse_error")
  assert_eq!(.severity, 5)
  assert_eq!(.action, "alert")
  assert_eq!(.attrs.dropped_by, "parse_api")
  assert_eq!(.attrs.dropped_reason, "abort")
  assert!(exists(.raw))
  assert_eq!(.tags, [])
'''
