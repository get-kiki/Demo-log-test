# ---------------------------------------------------------------------------
# Contract test ระหว่าง Vector (VRL) กับ Zod schema (packages/shared/src/schema.ts)
#
# `vector test --config-dir vector` รันไฟล์นี้แบบ offline ล้วนๆ — ไม่ต้องมี
# Postgres หรือ compose stack ทั้งชุด แค่ config เฉยๆ ก็รันได้ ปลอดภัยที่จะรัน
# ใน CI ทุก commit
#
# แต่ละเทสยิง event เข้าไปที่ transform ต้นทาง (insert_at) ที่ "envelope" ซึ่ง
# เป็นจุดแรกสุดของ pipeline แล้วไล่ผ่านของจริงทั้งสาย (envelope -> route_by_source
# -> parse_X) ก่อนไปเช็คผลที่ transform ปลายทาง (extract_from) — ทดสอบทั้ง
# pipeline ไม่ใช่แค่ parser เดี่ยวๆ ตัวอย่าง log ทุกอันคัดมาจาก FullStack
# Inturn.pdf หัวข้อ 4 ตรงๆ (ตัวเดียวกับที่กรรมการจะใช้ตอน acceptance test)
#
# หมายเหตุ: เทสในไฟล์นี้เช็คแค่ field-by-field ด้วย VRL assertion (ฝั่ง Vector)
# ส่วนขา Zod (ฝั่ง TypeScript) อยู่ใน /tests/contract/ — คนละสเต็ป เอาไว้ทำต่อ
# ---------------------------------------------------------------------------

# ============ 1) firewall — syslog raw, ผ่าน envelope guess + route ============

[[tests]]
name = "firewall: syslog deny -> normalize ครบ + tag internal"

[[tests.inputs]]
insert_at = "envelope"
type      = "raw"
value     = "<134>Aug 20 12:44:56 fw01 vendor=demo product=ngfw action=deny src=10.0.1.10 dst=8.8.8.8 spt=5353 dpt=53 proto=udp msg=DNS blocked policy=Block-DNS"

[[tests.outputs]]
extract_from = "parse_firewall"

[[tests.outputs.conditions]]
type   = "vrl"
source = '''
  assert_eq!(.tenant, "demoA")
  assert_eq!(.source, "firewall")
  assert_eq!(.event_type, "firewall_traffic")
  assert_eq!(.action, "deny")
  assert_eq!(.severity, 5)
  assert_eq!(.src_ip, "10.0.1.10")
  assert_eq!(.dst_ip, "8.8.8.8")
  assert_eq!(.host, "fw01")
  assert_eq!(.attrs.rule_name, "Block-DNS")
  assert_eq!(.attrs.vendor, "demo")
  assert_eq!(.attrs.product, "ngfw")
  assert!(includes!(.tags, "internal"))
'''

