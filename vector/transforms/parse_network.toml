# ตัวอย่าง input จริงจากข้อสอบ:
# <190>Aug 20 13:01:02 r1 if=ge-0/0/1 event=link-down mac=aa:bb:cc:dd:ee:ff reason=carrier-loss
#
# Mapping ตาม Schema กลาง — if/mac/reason ไม่มีคอลัมน์เฉพาะ ยุบรวมไว้ใน attrs

type            = "remap"
inputs          = ["route_by_source.network"]
reroute_dropped = true
source          = '''
  sys = parse_syslog!(.message)

  # ปัญหาเดียวกับ parse_firewall.toml: parse_syslog ตัด token แรกหลัง hostname
  # ไปเก็บเป็น sys.appname (คิดว่าเป็น TAG[PID]:) ทำให้คู่แรก (if=ge-0/0/1) หลุด
  # จาก sys.message ไป ต้องต่อกลับก่อน parse_key_value
  appname_part = if sys.appname == null { "" } else { to_string(sys.appname) }
  kv, kv_err = parse_key_value(appname_part + " " + sys.message,
    key_value_delimiter: "=",
    field_delimiter: " ",
    accept_standalone_key: true)
  if kv_err != null { kv = {} }

  .event_id      = uuid_v7()
  .ts            = format_timestamp!(sys.timestamp, "%+")
  .ingested_at   = format_timestamp!(now(), "%+")
  .tenant        = if kv.tenant == null { "demoA" } else { kv.tenant }   # TODO: เหมือนกับ parse_firewall.toml
  .source        = "network"
  .event_type    = if kv.event == null { "network_event" } else { kv.event }   # รายละเอียดเฉพาะ: link-down / link-up
  .event_subtype = null

  # link-down / link-up ไม่ใช่ allow/deny/login/create/delete — จัดเป็น "alert"
  # (หมวดกว้างสำหรับการแจ้งเตือนสถานะที่ไม่เข้าพวกอื่น) ตาม enum ของข้อสอบ
  .action = "alert"

  .severity = if kv.event == "link-down" { 7 }
    else if kv.event == "link-up" { 2 }
    else { 4 }   # เหตุการณ์อื่นที่ยังไม่รู้จัก — กลางๆ ไว้ก่อน

  .src_ip = null
  .dst_ip = null
  .host   = if sys.hostname == null { "unknown" } else { sys.hostname }
  .user   = null

  .attrs = {
    "if":     kv."if",
    "mac":    kv.mac,
    "reason": kv.reason,
  }

  .raw  = .message
  .tags = []

  del(.message)
  del(.source_hint)
  del(.collector_ip)
'''
