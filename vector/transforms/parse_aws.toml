# ตัวอย่าง input จริงจากข้อสอบ (AWS CloudTrail ย่อ):
# {
#   "tenant":"demoB", "source":"aws",
#   "cloud":{"service":"iam","account_id":"123456789012","region":"ap-southeast-1"},
#   "event_type":"CreateUser", "user":"admin",
#   "@timestamp":"2025-08-20T09:10:00Z",
#   "raw": {"eventName":"CreateUser","requestParameters":{"userName":"temp-user"}}
# }
#
# หมายเหตุ: input มี field ชื่อ "raw" ของตัวเองอยู่แล้ว (nested object รายละเอียด
# event) ชนชื่อกับ .raw ของเรา (TEXT เก็บข้อความดิบทั้งก้อน) — เราแก้โดย snapshot
# ทั้ง object เป็น .raw (string) เป็นบรรทัดแรกสุดก่อนแตะอะไรทั้งนั้น ทำให้ raw เดิม
# ของ input ถูกเก็บรวมอยู่ใน string นั้นแล้ว ไม่ต้องแยกจัดการอีก

type            = "remap"
inputs          = ["route_by_source.aws"]
reroute_dropped = true
source          = '''
  .raw = encode_json(.)

  ts_raw = ."@timestamp"
  # เช็ค .tenant ด้วย — ดูเหตุผลเต็มที่ parse_api.toml (บั๊กจริงที่เจอ: event ที่
  # ไม่มี tenant เคยผ่านมาถึง postgres sink แล้วพังแบบไม่เข้า dead-letter)
  if ts_raw == null || .event_type == null || .tenant == null { abort }

  .event_id      = uuid_v7()
  .ts            = format_timestamp!(parse_timestamp!(to_string!(ts_raw), "%+"), "%+")
  .ingested_at   = format_timestamp!(now(), "%+")
  .source        = "aws"
  .event_subtype = null

  # CloudTrail ไม่มี field action ตรงๆ เดาจากชื่อ event_type เหมือน parse_api
  # (เช่น CreateUser -> create, DeleteUser -> delete) เช็ค fail/denied ก่อนเสมอ
  et = downcase(to_string(.event_type) ?? "")
  .action = if contains(et, "fail") || contains(et, "denied") { "deny" }
    else if contains(et, "login") || contains(et, "logon") { "login" }
    else if contains(et, "logout") { "logout" }
    else if contains(et, "create") { "create" }
    else if contains(et, "delete") { "delete" }
    else { "alert" }

  # severity มา 2 ชั้น: (1) base ตาม action ที่เพิ่งแมปไว้ (2) keyword ที่สื่อความ
  # อันตรายเฉพาะทาง ชนะ base เสมอถ้าให้ค่าสูงกว่า — ดูรายละเอียดที่ parse_api.toml
  base = if .action == "deny" { 6 }
    else if .action == "delete" { 6 }
    else if .action == "create" { 4 }
    else if .action == "alert" { 5 }
    else { 1 }

  floor = if contains(et, "ransomware") || contains(et, "malware") || contains(et, "exfiltrat") || contains(et, "breach") || contains(et, "compromis") || contains(et, "backdoor") || contains(et, "trojan") { 10 }
    else if contains(et, "privilege") || contains(et, "escalat") || contains(et, "root") || contains(et, "superuser") || contains(et, "administrator") || contains(et, "unauthorized") || contains(et, "suspicious") || contains(et, "bruteforce") || contains(et, "exploit") || contains(et, "injection") || contains(et, "anomaly") { 8 }
    else if contains(et, "credential") || contains(et, "password") || contains(et, "secret") || contains(et, "mfa") || contains(et, "apikey") || contains(et, "api_key") { 7 }
    else if contains(et, "role") || contains(et, "policy") || contains(et, "permission") || contains(et, "iam") { 6 }
    else { 0 }

  .severity = if floor > base { floor } else { base }

  .src_ip = null
  .dst_ip = null

  # cloud.* ไม่มีคอลัมน์เฉพาะในตาราง logs ยุบรวมไว้ใน attrs.cloud ตาม namespace
  # เดียวกับที่ schema กลางในข้อสอบตั้งชื่อไว้ (cloud.account_id / region / service)
  .attrs = {
    "cloud": {
      "account_id": .cloud.account_id,
      "region":     .cloud.region,
      "service":    .cloud.service,
    },
  }

  .tags = []

  del(."@timestamp")
  del(.cloud)
  del(.received_at)
  del(.source_hint)
  del(.collector_ip)
'''
